[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ktroid"
version = "2.0.0"
description = "Build, run and test native Android apps entirely from the terminal."
readme = "README.md"
authors = [
    { name = "apfsource" }
]
requires-python = ">=3.7"
[project.urls]
Homepage = "https://ktd.acharyaml.com"
Documentation = "https://ktd.acharyaml.com/docs.html"
Repository = "https://github.com/apfsource/ktroid"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
ktroid = "ktroid.cli:main"
ktd = "ktroid.cli:main"

[tool.setuptools]
packages = ["ktroid"]

[tool.setuptools.package-data]
ktroid = ["templates/*", "config.json"]
